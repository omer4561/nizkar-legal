<!doctype html>
<html dir="rtl" lang="he">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow">
<title>נזכר · שאלון קצר</title>
<style>
  /* אותם טוקנים כמו באפליקציה (src/theme/palette.ts, ספריית 2000): החדר הוא
     הרקע, והדף הוא מחברת עם שורות שרטוט כחולות. הדף נשאר נייר בהיר גם בלילה,
     כמו באפליקציה, ורק החדר משתנה. אין גופנים חיצוניים: הדף לא פונה לשום
     שרת מלבד פונקציית ה-survey. */
  :root{
    --ground:#E4E1D6; --paper:#FBFAF5; --paper-edge:#D8D4C6; --rule:#A8C4DE;
    --ink:#16283A; --ink-soft:#4A5866; --blue:#1F4E79; --red:#B4342C;
    --line:26px;
  }
  @media (prefers-color-scheme: dark){
    :root{ --ground:#1A1F21; --paper:#E4E1D7; --paper-edge:#BAB6A8; --rule:#8FA9C0; --ink:#14222F; --ink-soft:#46525E; --blue:#3A78AC; }
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--ground); color:var(--ink);
    font-family:'Assistant','Segoe UI',Roboto,Arial,sans-serif;
    font-size:17px; line-height:var(--line); padding:20px 14px 60px;
  }
  main{
    max-width:640px; margin:0 auto; padding:var(--line) 22px calc(var(--line) * 2);
    background-color:var(--paper); border:1px solid var(--paper-edge); border-radius:4px;
    background-image:repeating-linear-gradient(to bottom, transparent 0, transparent calc(var(--line) - 1px), var(--rule) calc(var(--line) - 1px), var(--rule) var(--line));
    background-position:0 var(--line); background-origin:border-box;
  }
  h1{font-family:'David Libre','David','Times New Roman',serif;font-size:28px;line-height:calc(var(--line) * 2);margin:0;}
  .sub{color:var(--ink-soft);margin:0 0 var(--line);font-size:15px;line-height:var(--line);}
  fieldset{border:0;padding:0;margin:0 0 var(--line);min-inline-size:0;}
  legend{font-weight:700;padding:0;margin:0;line-height:var(--line);}
  label.opt{display:flex;gap:10px;align-items:center;min-height:var(--line);padding:0;cursor:pointer;}
  label.opt input{margin:0;accent-color:var(--blue);}
  textarea{
    display:block;width:100%;height:calc(var(--line) * 3);margin:0;padding:0;font:inherit;line-height:var(--line);
    color:var(--ink);background:transparent;border:0;border-radius:0;resize:none;
  }
  textarea:focus{outline:0;}
  .hint{font-size:13px;color:var(--ink-soft);margin:0;line-height:var(--line);}
  .btn{
    font:inherit;font-weight:700;height:calc(var(--line) * 2);padding:0 28px;border-radius:4px;border:0;
    background:var(--blue);color:var(--paper);cursor:pointer;
  }
  .btn[disabled]{opacity:.6;cursor:default;}
  #msg{margin:var(--line) 0 0;min-height:var(--line);}
  #msg.error{color:var(--red);}
  .done{padding:0;}
  .done p{margin:0;}
</style>
</head>
<body>
<main>
  <h1>שאלון קצר</h1>
  <p class="sub" id="sub">אנחנו טוענים את השאלות.</p>
  <form id="form" hidden novalidate></form>
  <p id="msg" role="status" aria-live="polite"></p>
</main>
<script>
(function () {
  'use strict';

  // כתובת פונקציית ה-survey ב-Supabase. הפונקציה פתוחה (בלי JWT) והאימות הוא
  // הטוקן שבקישור, ולכן אין כאן מפתח.
  var API = 'https://bijcqijyrpymlhaatupg.supabase.co/functions/v1/survey';

  var sub = document.getElementById('sub');
  var form = document.getElementById('form');
  var msg = document.getElementById('msg');

  var ERRORS = {
    invalid_link: 'הקישור הזה לא תקין. אפשר לפתוח אותו שוב מהמייל.',
    expired: 'הקישור פג תוקף (הוא פעיל 14 ימים). אפשר לשלוח דיווח חדש מההגדרות באפליקציה.',
    already_answered: 'כבר ענית על השאלון הזה, תודה.',
    invalid_answers: 'חסרה תשובה באחת השאלות. בדוק ונסה שוב.',
    failed: 'משהו השתבש אצלנו. נסה שוב בעוד רגע.'
  };

  // הטוקן נמצא אחרי # כדי שלא יישלח לשרת ולא יירשם בלוגים. מוציאים אותו
  // מהכתובת מיד, כדי שלא יישאר בהיסטוריה או בשיתוף של הדף.
  var match = /(?:^#|&)t=([A-Za-z0-9_-]{43})(?:&|$)/.exec(location.hash);
  var token = match ? match[1] : '';
  if (token) history.replaceState(null, '', location.pathname);

  function show(text, isError) {
    msg.textContent = text;
    msg.className = isError ? 'error' : '';
  }

  function call(body) {
    return fetch(API, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    }).then(function (res) {
      return res.json().catch(function () { return {}; }).then(function (data) {
        return { ok: res.ok, data: data };
      });
    });
  }

  function fail(code) {
    sub.textContent = '';
    form.hidden = true;
    show(ERRORS[code] || ERRORS.failed, true);
  }

  if (!token) { fail('invalid_link'); return; }

  function el(tag, props, children) {
    var node = document.createElement(tag);
    Object.keys(props || {}).forEach(function (key) { node[key] = props[key]; });
    (children || []).forEach(function (child) { node.appendChild(child); });
    return node;
  }

  function render(questions) {
    sub.textContent = 'אפשר לענות בקצרה, זה לוקח כדקה. כל מה שתכתוב נשלח רק לבעל האפליקציה.';

    questions.forEach(function (q, i) {
      var legend = el('legend', { textContent: (i + 1) + '. ' + q.text });
      var set = el('fieldset', {}, [legend]);
      set.dataset.index = String(i);

      (q.options || []).forEach(function (option) {
        var radio = el('input', { type: 'radio', name: 'q' + i, value: option });
        set.appendChild(el('label', { className: 'opt' }, [radio, el('span', { textContent: option })]));
      });

      if (q.agentFree || q.free) {
        var area = el('textarea', { name: 'text' + i, maxLength: 300 });
        area.setAttribute('aria-label', q.agentFree ? 'התשובה שלך' : 'רוצה להוסיף משהו? (לא חובה)');
        set.appendChild(area);
        set.appendChild(el('p', { className: 'hint', textContent: q.agentFree ? 'שאלה פתוחה, אפשר לכתוב במילים שלך.' : 'אפשר להוסיף פרט, לא חובה.' }));
      }
      form.appendChild(set);
    });

    var submit = el('button', { type: 'submit', className: 'btn', textContent: 'שליחה' });
    form.appendChild(submit);
    form.hidden = false;

    form.addEventListener('submit', function (event) {
      event.preventDefault();
      var answers = [];

      for (var i = 0; i < questions.length; i++) {
        var q = questions[i];
        var choiceNode = form.querySelector('input[name="q' + i + '"]:checked');
        var textNode = form.querySelector('textarea[name="text' + i + '"]');
        var text = textNode ? textNode.value.trim() : '';

        if (q.agentFree && !text) { show('חסרה תשובה בשאלה ' + (i + 1) + '.', true); return; }
        if (!q.agentFree && !choiceNode) { show('חסרה תשובה בשאלה ' + (i + 1) + '.', true); return; }
        answers.push({ choice: choiceNode ? choiceNode.value : '', text: text });
      }

      submit.disabled = true;
      show('שולח...', false);
      call({ action: 'answer', token: token, answers: answers }).then(function (result) {
        if (result.ok) {
          form.hidden = true;
          sub.textContent = '';
          msg.className = '';
          msg.textContent = '';
          var done = el('div', { className: 'done' }, [el('strong', { textContent: 'תודה, קיבלנו.' }), el('p', { textContent: 'התשובות הגיעו אלינו ואנחנו בודקים. לא נשלח תזכורת.' })]);
          document.querySelector('main').appendChild(done);
        } else {
          submit.disabled = false;
          show(ERRORS[result.data.error] || ERRORS.failed, true);
        }
      }).catch(function () {
        submit.disabled = false;
        show(ERRORS.failed, true);
      });
    });
  }

  call({ action: 'get', token: token }).then(function (result) {
    if (!result.ok || !Array.isArray(result.data.questions)) { fail(result.data.error); return; }
    render(result.data.questions);
  }).catch(function () { fail('failed'); });
})();
</script>
</body>
</html>
